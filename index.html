 P=[0,1].map(t=>ROLE.map((r,i)=>({t,i,x:0,y:0,vx:0,vy:0,fx:t?-1:1,fy:0,st:100,cd:0,hold:0,gk:!i,spr:false,hx:(t?1-r[0]:r[0])*W,hy:r[1]*H})));

function reset(kt){for(const t of[0,1])for(const p of P[t]){p.x=t?Math.max(p.hx,W/2+30):Math.min(p.hx,W/2-30);p.y=p.hy;p.vx=p.vy=0;p.fx=t?-1:1;p.fy=0;p.hold=0;p.cd=0}
 const f=P[kt][4];f.x=W/2+(kt?14:-14);f.y=H/2;B={x:W/2,y:H/2,vx:0,vy:0,o:null,lk:null,lt:0,rot:0,tr:[]};G.ci=4;G.ch=0}

function shoot(p,pw,mx,my){const t=p.t,gk=P[1-t][0];let dx,dy;
 if(t==0&&Math.hypot(mx,my)>.35&&mx>.15){dx=mx;dy=my}else{dx=(t?0:W)-p.x;dy=H/2+(gk.y<H/2?1:-1)*(GH/2-20)+rnd(-8,8)-p.y}

 if(has){p.hold+=dt;const gx=p.t?0:W,dg=Math.abs(gx-p.x),near=P[1-p.t].find(o=>!o.gk&&ds(o,p)<48);

 if(CH[p.t]==p){goTo(p,B.x+B.vx*.2,B.y+B.vy*.2,sp,dt);if(B.o&&B.o.t!=p.t&&ds(B.o,p)<26&&Math.random()<dt*3*D.tk)tackle(p);return}

function upd(dt){const D=G.D;G.mt=Math.max(0,G.mt-dt);G.shake=Math.max(0,G.shake-dt*30);

 $("#pl").onclick=()=>{ac();cfg.h=+$("#sh").value;cfg.a=+$("#sa").value;if(cfg.a==cfg.h)cfg.a=(cfg.h+1)%8;cfg.d=$("#sd").value;cfg.m=+$("#sm").value;try{localStorage.pfa=JSON.stringify(cfg)}catch(e){}start()}}

 $("#rm").onclick=start;$("#mn").onclick=menu}
function pause(){if(!G||G.st=="done")return;if(G.paused){G.paused=false;$("#panel").style.display="none";document.body.classList.add("play");return}
 G.paused=true;show(`<h1>Paused</h1><button class="big" id="rs">Resume</button><button class="big" id="rt">Restart</button><button class="big" id="mn">Menu</button>`);$("#rs").onclick=pause;$("#rt").onclick=()=>{G.paused=false;start()};$("#mn").onclick=menu}
$("#bPause").onclick=pause;$("#bFs").onclick=()=>{try{const d=document.documentElement;document.fullscreenElement?document.exitFullscreen():d.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock("landscape")).catch(()=>{})}catch(e){}};

/* drawing */
function badge(x,y,r,t){cx.fillStyle=TM[t][1];cx.strokeStyle=TM[t][2];cx.lineWidth=3;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();cx.stroke();cx.fillStyle=TM[t][2];cx.font=`800 ${r}px "Trebuchet MS"`;cx.textAlign="center";cx.textBaseline="middle";cx.fillText(TM[t][0][0],x,y+1)}
function pitch(){cx.fillStyle="#0e4b27";cx.fillRect(-40,-40,W+80,H+80);for(let i=0;i<10;i++){cx.fillStyle=i%2?"#2a8240":"#2f8f46";cx.fillRect(i*W/10,0,W/10,H)}
 cx.strokeStyle="#fff";cx.lineWidth=3;cx.strokeRect(0,0,W,H);cx.beginPath();cx.moveTo(W/2,0);cx.lineTo(W/2,H);cx.stroke();cx.beginPath();cx.arc(W/2,H/2,60,0,7);cx.stroke();
 for(const sd of[0,1]){const x=sd?W:0,d=sd?-1:1;cx.strokeRect(sd?W-110:0,H/2-130,110,260);cx.strokeRect(sd?W-42:0,GY-10,42,GH+20);
  cx.fillStyle="#ffffff30";cx.fillRect(sd?W:-28,GY,28,GH);cx.strokeStyle="#ffffff90";cx.lineWidth=1;for(let i=0;i<=GH;i+=13){cx.beginPath();cx.moveTo(x,GY+i);cx.lineTo(x-d*28,GY+i);cx.stroke()}
  cx.fillStyle="#fff";for(const y of[GY,GY+GH]){cx.beginPath();cx.arc(x,y,5,0,7);cx.fill()}cx.strokeStyle="#fff";cx.lineWidth=3}}
function draw(){cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle="#0b3a1f";cx.fillRect(0,0,cw,ch);cx.save();let sx=0,sy=0;if(G&&G.shake>0){sx=rnd(-1,1)*G.shake*.4;sy=rnd(-1,1)*G.shake*.4}
 cx.translate(ox+sx,oy+sy);cx.scale(s,s);pitch();
 if(G&&G.st){const all=[...P[0],...P[1]].sort((a,b)=>a.y-b.y),U=P[0][G.ci];
  for(const p of all){const c=TM[p.t?cfg.a:cfg.h],bob=G.st=="goal"&&G.conc!=p.t?-Math.abs(Math.sin(G.gt*9+p.i))*8:0;
   cx.fillStyle="#0004";cx.beginPath();cx.ellipse(p.x+2,p.y+6,11,6,0,0,7);cx.fill();
   if(p.spr){cx.fillStyle="#fff4";cx.beginPath();cx.arc(p.x-p.vx*.07,p.y-p.vy*.07,8,0,7);cx.fill()}
   cx.fillStyle=p.gk?"#20262e":c[1];cx.strokeStyle=p.gk?"#9ef":c[2];cx.lineWidth=3;cx.beginPath();cx.arc(p.x,p.y+bob,11,0,7);cx.fill();cx.stroke();
   cx.fillStyle="#f2c9a0";cx.beginPath();cx.arc(p.x+p.fx*10,p.y+bob+p.fy*10,3.5,0,7);cx.fill();
   cx.fillStyle=p.gk?"#9ef":c[2];cx.font='800 10px "Trebuchet MS"';cx.textAlign="center";cx.textBaseline="middle";cx.fillText(p.n||p.i+1,p.x,p.y+bob+1);
   if(p==U){cx.strokeStyle="#ffd23f";cx.lineWidth=3;cx.beginPath();cx.arc(p.x,p.y,17,0,7);cx.stroke();cx.fillStyle="#ffd23f";const a=-26+Math.sin(G.t*8)*2;cx.beginPath();cx.moveTo(p.x,p.y+a+8);cx.lineTo(p.x-6,p.y+a);cx.lineTo(p.x+6,p.y+a);cx.fill()}}
  if(B.tr.length>4&&Math.hypot(B.vx,B.vy)>300)for(let i=0;i<B.tr.length;i+=2){cx.fillStyle=`rgba(255,255,255,${i/B.tr.length*.3})`;cx.beginPath();cx.arc(B.tr[i],B.tr[i+1],i/B.tr.length*5,0,7);cx.fill()}
  cx.fillStyle="#0005";cx.beginPath();cx.ellipse(B.x+3,B.y+5,6,3.5,0,0,7);cx.fill();cx.fillStyle="#fff";cx.strokeStyle="#222";cx.lineWidth=1.5;cx.beginPath();cx.arc(B.x,B.y,6,0,7);cx.fill();cx.stroke();cx.fillStyle="#222";cx.beginPath();cx.arc(B.x+Math.cos(B.rot)*2.5,B.y+Math.sin(B.rot)*2.5,2,0,7);cx.fill()}
 cx.restore();if(G&&G.st&&G.st!="done")hud();else if(!G){cx.fillStyle="#0007";cx.fillRect(0,0,cw,ch)}}
function hud(){const U=P[0][G.ci],w=Math.min(cw-170,480),x=cw/2-w/2,m=Math.floor((G.dur-G.t)/60),sec=Math.ceil(G.dur-G.t)%60;
 cx.fillStyle="#06210fcc";cx.beginPath();cx.roundRect(x,4,w,40,20);cx.fill();badge(x+22,24,14,cfg.h);badge(x+w-22,24,14,cfg.a);
 cx.fillStyle="#fff";cx.textBaseline="middle";cx.font='700 12px "Trebuchet MS"';cx.textAlign="left";cx.fillText(TM[cfg.h][0],x+42,24);cx.textAlign="right";cx.fillText(TM[cfg.a][0],x+w-42,24);
 cx.textAlign="center";cx.font='800 22px "Trebuchet MS"';cx.fillText(G.sc[0]+" - "+G.sc[1],cw/2,18);cx.font='700 11px "Trebuchet MS"';cx.fillStyle="#ffd23f";cx.fillText(Math.max(0,m)+":"+String(sec%60).padStart(2,"0"),cw/2,36);
 const bw=130,bx=cw/2-bw/2,by=ch-16;cx.fillStyle="#0006";cx.fillRect(bx,by,bw,6);cx.fillStyle=U.st<20?"#ff5a36":"#6dff9a";cx.fillRect(bx,by,bw*U.st/100,6);
 if(G.ch>0){cx.fillStyle="#0006";cx.fillRect(bx,by-10,bw,6);cx.fillStyle="#ffd23f";cx.fillRect(bx,by-10,bw*G.ch,6)}
 let t="";if(G.st=="cd")t=String(Math.ceil(G.cdt));else if(G.mt>0)t=G.msg;
 if(t){cx.font=`800 ${t=="GOAL!"?72:54}px "Trebuchet MS"`;cx.fillStyle="#ffd23f";cx.strokeStyle="#222";cx.lineWidth=6;cx.textAlign="center";cx.textBaseline="middle";cx.save();cx.translate(cw/2,ch/2);if(t=="GOAL!")cx.rotate(-.06+Math.sin(G.gt*10)*.03);cx.strokeText(t,0,0);cx.fillText(t,0,0);cx.restore()}
 if(ch>cw){cx.font='700 13px "Trebuchet MS"';cx.fillStyle="#fff";cx.textAlign="center";cx.fillText("Rotate your phone to landscape for the best view",cw/2,ch*.18)}}
let last=0;function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.033);last=t;if(!(dt>0))return;if(G&&!G.paused&&G.st!="done")upd(dt);draw()}
menu();requestAnimationFrame(loop);
